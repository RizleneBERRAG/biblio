<title>Prospection EQ110</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700&family=Source+Sans+3:wght@400;600&family=JetBrains+Mono:wght@500&display=swap">
<style>
:root{--paper:#f5f7f3;--panel:#ffffff;--ink:#1b221d;--muted:#5d665f;--line:#d7ddd5;--accent:#2e7d5b;--accent-ink:#fff;--soft:#e4efe8;--amber:#b7791f;--amber-soft:#fff1d6;--blue:#2b63b3;--blue-soft:#e3ecfb;--red:#b4382f;--red-soft:#fbe4e1;--violet:#6b4fa6;--violet-soft:#ece6f8;--grey-soft:#e9ebe7;--shadow:0 1px 2px rgba(20,30,20,.08);--focus:#2e7d5b}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--paper:#141915;--panel:#1c231e;--ink:#e6eae4;--muted:#a3ada5;--line:#2f382f;--accent:#6fc39b;--accent-ink:#0f1a14;--soft:#1f3328;--amber:#e0a63b;--amber-soft:#3a2b10;--blue:#7fa8ea;--blue-soft:#1b2a44;--red:#ef8b82;--red-soft:#43201d;--violet:#b39ae6;--violet-soft:#2a2340;--grey-soft:#262d28;--shadow:none}}
:root[data-theme="dark"]{--paper:#141915;--panel:#1c231e;--ink:#e6eae4;--muted:#a3ada5;--line:#2f382f;--accent:#6fc39b;--accent-ink:#0f1a14;--soft:#1f3328;--amber:#e0a63b;--amber-soft:#3a2b10;--blue:#7fa8ea;--blue-soft:#1b2a44;--red:#ef8b82;--red-soft:#43201d;--violet:#b39ae6;--violet-soft:#2a2340;--grey-soft:#262d28;--shadow:none}
*{box-sizing:border-box}
body{margin:0;background:var(--paper);color:var(--ink);font-family:"Source Sans 3","Segoe UI",system-ui,sans-serif;font-size:15px;line-height:1.45;padding-inline:16px;padding-block:0 24px}
h1,h2,h3{font-family:"Bricolage Grotesque","Source Sans 3",sans-serif;margin:0;line-height:1.15;text-wrap:balance}
.num{font-family:"JetBrains Mono",monospace;font-variant-numeric:tabular-nums;font-size:.92em}
button,select,input,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--focus);outline-offset:2px}
header.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--paper);padding:14px 0 10px;border-bottom:1px solid var(--line);display:flex;flex-wrap:wrap;gap:10px 18px;align-items:center}
header.top h1{font-size:20px;font-weight:700}
header.top .sub{color:var(--muted);font-size:13px}
.kpis{display:flex;flex-wrap:wrap;gap:8px;margin-left:auto}
.kpi{background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:6px 10px;min-width:90px;box-shadow:var(--shadow)}
.kpi b{display:block;font-family:"Bricolage Grotesque",sans-serif;font-size:17px}
.kpi span{font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.06em}
.sync{font-size:12px;color:var(--muted);display:flex;align-items:center;gap:6px}
.sync i{width:8px;height:8px;border-radius:50%;background:var(--amber);display:inline-block}
.sync.ok i{background:var(--accent)}.sync.local i{background:var(--red)}
.wrap{display:grid;grid-template-columns:minmax(300px,420px) minmax(0,1fr);gap:18px;margin-top:14px;align-items:start}
@media (max-width:860px){.wrap{grid-template-columns:1fr}}
.tools{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:10px}
.tools input[type=search]{grid-column:1/-1}
.tools input,.tools select{width:100%;padding:8px 10px;border:1px solid var(--line);border-radius:8px;background:var(--panel)}
.count{font-size:12px;color:var(--muted);margin:0 0 6px 2px}
.list{display:flex;flex-direction:column;gap:6px;max-height:calc(100vh - 230px);overflow:auto;padding-right:2px}
@media (max-width:860px){.list{max-height:none}}
.card{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:10px 12px;display:grid;grid-template-columns:1fr auto;gap:2px 10px;text-align:left;width:100%;box-shadow:var(--shadow)}
.card.sel{border-color:var(--accent);box-shadow:0 0 0 2px var(--soft)}
.card .rs{font-weight:600;grid-column:1}
.card .loc{color:var(--muted);font-size:13px;grid-column:1}
.card .prime{grid-column:2;grid-row:1;font-weight:600;text-align:right}
.card .px{grid-column:1;font-size:12px;color:var(--accent);font-weight:600}
.card .pill{grid-column:2;grid-row:2;justify-self:end}
.pill{display:inline-block;font-size:11.5px;padding:2px 8px;border-radius:999px;background:var(--grey-soft);color:var(--ink);white-space:nowrap}
.pill[data-s="rappeler"]{background:var(--amber-soft);color:var(--amber)}
.pill[data-s="rdv"]{background:var(--blue-soft);color:var(--blue)}
.pill[data-s="signe"]{background:var(--soft);color:var(--accent)}
.pill[data-s="refus"]{background:var(--red-soft);color:var(--red)}
.pill[data-s="injoignable"]{background:var(--violet-soft);color:var(--violet)}
.pill.late{outline:2px solid var(--red)}
.detail{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:18px 20px;box-shadow:var(--shadow);position:sticky;top:calc(env(safe-area-inset-top,0px) + 86px)}
@media (max-width:860px){.detail{position:fixed;inset:0;z-index:20;overflow:auto;border-radius:0;padding-top:calc(env(safe-area-inset-top,0px) + 12px);display:none}.detail.open{display:block}}
.detail .back{display:none;margin-bottom:10px;background:none;border:1px solid var(--line);border-radius:8px;padding:6px 10px}
@media (max-width:860px){.detail .back{display:inline-block}}
.detail h2{font-size:22px}
.detail .meta{color:var(--muted);font-size:13px;margin:4px 0 12px}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:12px 18px;margin:12px 0}
.grid dl{margin:0}.grid dt{font-size:11px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);margin-top:8px}.grid dd{margin:0;font-weight:600}
.grid dd a{color:var(--blue);text-decoration:none}.grid dd a:hover{text-decoration:underline}
.actions{display:flex;flex-wrap:wrap;gap:8px;margin:8px 0 14px}
.btn{border:1px solid var(--line);background:var(--panel);border-radius:8px;padding:8px 12px;font-weight:600;text-decoration:none;color:var(--ink);display:inline-flex;align-items:center;gap:6px}
.btn.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.suivi{border-top:1px solid var(--line);padding-top:14px;margin-top:6px}
.bt{border-top:1px solid var(--line);padding-top:14px;margin-top:6px}
.bt h3{font-size:16px}.bt h3 .src{font-weight:400;color:var(--muted);font-size:13px}
.bt h4{font-family:"Bricolage Grotesque",sans-serif;font-size:13px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);margin:14px 0 6px}
.btst{margin:6px 0 10px}
.qgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:8px 14px}
.qgrid dt{font-size:11px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted)}.qgrid dd{margin:0;font-weight:600}
.notes,.docs{margin:0;padding-left:18px}.notes li,.docs li{margin:4px 0}
.hist{color:var(--muted);font-size:14px}
.cap{display:block;width:100%;max-width:520px;border:1px solid var(--line);border-radius:8px}
.caplink{display:inline-block}
.suivi h3{font-size:15px;margin-bottom:8px}
.statuts{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:10px}
.statuts button{border:1px solid var(--line);background:var(--panel);border-radius:999px;padding:5px 11px;font-size:13px}
.statuts button[aria-pressed="true"]{background:var(--ink);color:var(--paper);border-color:var(--ink)}
.row{display:grid;grid-template-columns:1fr auto;gap:8px;align-items:end;margin-bottom:8px}
label.f{display:block;font-size:12px;color:var(--muted)}
label.f input,label.f textarea{display:block;width:100%;margin-top:3px;padding:8px 10px;border:1px solid var(--line);border-radius:8px;background:var(--paper)}
label.f textarea{min-height:88px;resize:vertical}
.saved{font-size:12px;color:var(--muted);min-height:16px}
.empty{color:var(--muted);padding:40px 10px;text-align:center}
.note{font-size:12px;color:var(--muted);margin-top:14px;border-top:1px solid var(--line);padding-top:8px}
@media (prefers-reduced-motion:no-preference){.card{transition:border-color .15s}}
#lock{position:fixed;inset:0;z-index:50;background:var(--paper);display:flex;align-items:center;justify-content:center;padding:16px}
.lockbox{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:24px;max-width:360px;width:100%;box-shadow:var(--shadow)}
.lockbox h2{font-size:20px}.lockbox p{color:var(--muted);margin:6px 0 14px}.lockbox .err{color:var(--red);min-height:18px;margin:6px 0}
</style>

const STATUTS = {a_appeler:"À appeler",rappeler:"À rappeler",rdv:"RDV pris",signe:"Devis signé",refus:"Refusé",injoignable:"Injoignable"};
const eur = n => new Intl.NumberFormat("fr-FR",{style:"currency",currency:"EUR",maximumFractionDigits:0}).format(n);
const nb = n => new Intl.NumberFormat("fr-FR").format(n);
const todayISO = () => new Date().toISOString().slice(0,10);
const esc = s => String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const telHref = t => t ? "tel:+33"+t.replace(/^0/,"") : "";
const fmtTel = t => t ? t.replace(/(\d{2})(?=\d)/g,"$1 ") : "";

let suivi = {};           // num -> {statut, note, rappel, maj}
let selected = null;
let db = null, dbOK = false;
const $ = id => document.getElementById(id);
const syncEl = $("sync");

function setSync(mode, txt){ syncEl.className = "sync "+mode; syncEl.querySelector("span").textContent = txt; }

// ---------- stockage local de repli (par navigateur) ----------
const LS = "prospection-eq110-suivi";
function loadLocal(){ try{ const v = JSON.parse(localStorage.getItem(LS)||"{}"); return (v && typeof v==="object") ? v : {}; }catch(e){ return {}; } }
function saveLocal(){ try{ localStorage.setItem(LS, JSON.stringify(suivi)); }catch(e){} }

// ---------- suivi partagé (db) ----------
async function initDb(){
  try{
    db = (typeof claude !== "undefined" && claude && claude.use) ? await claude.use("db") : null;
  }catch(e){ db = null; }
  if(!db){ suivi = loadLocal(); setSync("local","Suivi enregistré sur cet appareil seulement"); render(); return; }
  db.collection("suivi").onSnapshot(snap => {
    const next = {};
    snap.docs.forEach(d => { const x = d.data(); if(x) next[d.id] = x; });
    suivi = next; dbOK = true;
    setSync("ok","Suivi partagé à jour");
    render(); if(selected) renderDetail(selected, true);
  }, err => { setSync("local","Suivi partagé indisponible : "+(err&&err.code||"erreur")); suivi = loadLocal(); render(); });
}

async function saveSuivi(num, patch){
  const cur = suivi[num] || {};
  const doc = Object.assign({}, cur, patch, {maj: new Date().toISOString()});
  suivi[num] = doc;
  if(db && dbOK){
    try{ await db.collection("suivi").doc(num).set(doc); $("saved").textContent = "Enregistré"; }
    catch(e){ saveLocal(); $("saved").textContent = "Enregistré sur cet appareil seulement ("+(e&&e.code||"erreur")+")"; }
  }else{ saveLocal(); $("saved").textContent = "Enregistré sur cet appareil"; }
  render();
}

// ---------- liste ----------
function etat(p){ return (suivi[p.n]||{}); }
function rappelLate(s){ return s.rappel && s.rappel < todayISO() && !["signe","refus"].includes(s.statut||""); }
function filtered(){
  const q = $("q").value.trim().toLowerCase(), dep = $("fdep").value, st = $("fst").value, ret = $("fretard").value, tri = $("tri").value;
  const in7 = new Date(Date.now()+7*864e5).toISOString().slice(0,10);
  let out = P.filter(p => {
    const s = etat(p); const cur = s.statut || "a_appeler";
    if(dep && p.dep!==dep) return false;
    if($("fpx").value && p.st!==$("fpx").value) return false;
    if($("fbt").value && ((p.bt&&p.bt.st)||"(absent de beTool)")!==$("fbt").value) return false;
    if(st && cur!==st) return false;
    if(ret==="retard" && !rappelLate(s)) return false;
    if(ret==="semaine" && !(s.rappel && s.rappel<=in7)) return false;
    if(q){ const hay = [p.rs,p.sig,p.ville,p.site,p.tel,p.mail,p.n,p.cp,s.note,p.bt&&p.bt.q.secteur,p.bt&&p.bt.notes.map(n=>n.t).join(" ")].join(" ").toLowerCase(); if(!hay.includes(q)) return false; }
    return true;
  });
  const key = {prime:(a,b)=>b.p-a.p, rs:(a,b)=>a.rs.localeCompare(b.rs,"fr"), dep:(a,b)=>a.dep.localeCompare(b.dep)||b.p-a.p,
    rappel:(a,b)=>((etat(a).rappel||"9999")).localeCompare(etat(b).rappel||"9999")||b.p-a.p,
    maj:(a,b)=>((etat(b).maj||"")).localeCompare(etat(a).maj||"")}[tri];
  return out.sort(key);
}
function render(){
  const rows = filtered();
  const list = $("list"); list.innerHTML = "";
  rows.forEach(p => {
    const s = etat(p); const cur = s.statut||"a_appeler";
    const b = document.createElement("button"); b.className = "card"+(selected===p.n?" sel":""); b.setAttribute("role","listitem"); b.dataset.n = p.n;
    b.innerHTML = `<span class="rs">${esc(p.rs)}</span><span class="prime num">${eur(p.p)}</span><span class="loc">${esc(p.ville)} (${esc(p.dep)}) · ${esc(p.mat.replace("THALEOS APVT-630","APVT-630"))}</span><span class="px">Pixel : ${esc(p.st)} · depuis le ${esc(p.ds)}${p.bt?` &nbsp;·&nbsp; beTool : <b>${esc(p.bt.st)}</b>`:""}</span><span class="pill${rappelLate(s)?" late":""}" data-s="${cur}">${STATUTS[cur]}${s.rappel?" · "+s.rappel.split("-").reverse().slice(0,2).join("/"):""}</span>`;
    b.addEventListener("click", () => { selected = p.n; render(); renderDetail(p.n); });
    list.appendChild(b);
  });
  $("count").textContent = rows.length+" prospect"+(rows.length>1?"s":"")+" · "+eur(rows.reduce((a,p)=>a+p.p,0))+" de primes";
  const tot = P.length, done = P.filter(p=>["signe","refus"].includes(etat(p).statut||"")).length, touched = P.filter(p=>suivi[p.n]).length, late = P.filter(p=>rappelLate(etat(p))).length, signe = P.filter(p=>etat(p).statut==="signe");
  $("kpis").innerHTML = [[tot,"prospects"],[eur(P.reduce((a,p)=>a+p.p,0)),"primes en jeu"],[touched,"contactés"],[signe.length+" / "+eur(signe.reduce((a,p)=>a+p.p,0)),"signés"],[late,"rappels en retard"]].map(([v,l])=>`<div class="kpi"><b class="num">${v}</b><span>${l}</span></div>`).join("");
}

// ---------- détail ----------
function renderDetail(num, keepFocus){
  const p = P.find(x=>x.n===num); if(!p) return;
  const s = etat(p); const cur = s.statut||"a_appeler";
  const d = $("detail"); d.classList.add("open");
  const active = document.activeElement && d.contains(document.activeElement) ? document.activeElement.id : null;
  if(keepFocus && active && (active==="note"||active==="rappel")) return;   // ne pas écraser une saisie en cours
  d.innerHTML = `
    <button class="back" type="button" id="back">← Retour à la liste</button>
    <h2>${esc(p.rs)}</h2>
    <div class="meta">${esc(p.n)} · <strong style="color:var(--accent)">Statut Pixel : ${esc(p.st)}</strong> depuis le ${esc(p.ds)} · ${esc(p.org)} · <a href="${esc(p.lien)}" target="_blank" rel="noopener">Ouvrir dans Pixel</a></div>
    <div class="actions">
      ${p.tel?`<a class="btn primary" href="${telHref(p.tel)}">📞 ${fmtTel(p.tel)}</a>`:""}
      ${p.mail?`<a class="btn" href="mailto:${esc(p.mail)}">✉ ${esc(p.mail)}</a>`:""}
      <a class="btn" href="https://www.google.com/maps/search/${encodeURIComponent(p.adr+" "+p.cp+" "+p.ville)}" target="_blank" rel="noopener">🗺 Itinéraire</a>
    </div>
    <div class="grid">
      <dl><dt>Signataire</dt><dd>${esc(p.sig||"—")}${p.fn?" <span style='font-weight:400;color:var(--muted)'>("+esc(p.fn)+")</span>":""}</dd>
          <dt>SIRET</dt><dd class="num">${esc(p.siret||"—")}</dd>
          <dt>Site des travaux</dt><dd>${esc(p.site)}<br><span style="font-weight:400">${esc(p.adr)}, ${esc(p.cp)} ${esc(p.ville)}</span></dd></dl>
      <dl><dt>Prime CEE (100 % du devis)</dt><dd class="num">${eur(p.p)}</dd>
          <dt>Devis</dt><dd>${esc(p.devis||"—")} <span style="font-weight:400;color:var(--muted)">du ${esc(p.dd||"?")}</span></dd>
          <dt>Matériel</dt><dd>${esc(p.mat||"—")}${p.supp&&p.supp!=="0"?"<br><span style='font-weight:400'>+ "+esc(p.supp)+" site(s) supplémentaire(s)</span>":""}</dd>
          <dt>Volume CEE</dt><dd class="num">${nb(p.c)} kWh cumac</dd></dl>
    </div>
    ${p.bt?`<div class="bt">
      <h3>Pourquoi c'est un client potentiel <span class="src">(beTool Infiny · ticket ${esc(p.bt.tk)})</span></h3>
      <p class="btst">Statut beTool : <b>${esc(p.bt.st||"—")}</b>${p.bt.sd?" depuis le "+esc(p.bt.sd.split("-").reverse().join("/")):""}${p.bt.q.verif?" · liste "+esc(p.bt.q.verif.toLowerCase()):""}${p.bt.q.deleg?" · délégataire liste : "+esc(p.bt.q.deleg):""}</p>
      <div class="qgrid">
        ${[["Activité",p.bt.q.secteur],["Surface de toiture",p.bt.q.toiture?p.bt.q.toiture+" m²":""],["Panneaux prévus",p.bt.q.panneaux],["Puissance",p.bt.q.puissance?p.bt.q.puissance+" kWc":""],["Bâtiments",p.bt.q.bat],["Kit complet",p.bt.q.kit],["Panneaux au sol",p.bt.q.sol],["Zone climatique",p.bt.q.zone],["Parcelle",p.bt.q.parcelle],["Signataire",p.bt.q.sig?p.bt.q.sig+(p.bt.q.fonc?" ("+p.bt.q.fonc+")":""):""]].filter(x=>x[1]).map(([k,v])=>`<div><dt>${k}</dt><dd>${esc(v)}</dd></div>`).join("")}
      </div>
      ${p.bt.notes.length?`<h4>Notes des téléopérateurs</h4><ul class="notes">${p.bt.notes.map(n=>`<li><span class="num">${esc(n.d)}</span> <b>${esc(n.p)}</b> — ${esc(n.t)}</li>`).join("")}</ul>`:""}
      ${p.bt.docs.length?`<h4>Documents dans beTool</h4><ul class="docs">${p.bt.docs.map(x=>`<li>${esc(x)}</li>`).join("")}</ul>`:""}
      ${p.bt.hist.length?`<h4>Parcours dans beTool</h4><p class="hist">${p.bt.hist.map(h=>`${esc(h.d.split("-").reverse().join("/"))} ${esc(h.s)}`).join(" → ")}</p>`:""}
      ${p.bt.cap?`<h4>Capture de la fiche beTool</h4><a href="${esc(p.bt.cap)}" target="_blank" rel="noopener" class="caplink"><img class="cap" loading="lazy" src="${esc(p.bt.cap)}" alt="Fiche beTool ${esc(p.bt.tk)}"></a>`:""}
    </div>`:`<div class="bt"><h3>Pourquoi c'est un client potentiel</h3><p class="btst">Ce dossier n'a pas été retrouvé dans beTool : seules les données Pixel sont disponibles.</p></div>`}
    <div class="suivi">
      <h3>Suivi de l'appel</h3>
      <div class="statuts" id="statuts">${Object.entries(STATUTS).map(([k,v])=>`<button type="button" data-s="${k}" aria-pressed="${cur===k}">${v}</button>`).join("")}</div>
      <div class="row"><label class="f">Rappeler le<input type="date" id="rappel" value="${esc(s.rappel||"")}"></label><button class="btn" type="button" id="clearRappel">Effacer</button></div>
      <label class="f">Notes (qui, quoi, objections, prochaine étape)<textarea id="note" placeholder="Ex. : parlé à M. Cazin, sèche du bois de chauffage, veut voir un chantier. Rappeler lundi.">${esc(s.note||"")}</textarea></label>
      <div class="row"><div class="saved" id="saved">${s.maj?"Dernière mise à jour : "+new Date(s.maj).toLocaleString("fr-FR"):"Aucun suivi encore"}</div><button class="btn primary" type="button" id="save">Enregistrer</button></div>
    </div>
    <div class="note">Données issues de Pixel (devis préparé par Eco Pro Concept, jamais envoyé). Vérifier avec Isolidarité la validité de la fiche AGRI-EQ-110 après le 23/09/2026 avant d'engager le client.</div>`;
  $("back").addEventListener("click", () => { d.classList.remove("open"); selected = null; render(); });
  $("statuts").querySelectorAll("button").forEach(b => b.addEventListener("click", () => saveSuivi(p.n, {statut:b.dataset.s, note:$("note").value.trim(), rappel:$("rappel").value||""}).then(()=>renderDetail(p.n))));
  $("save").addEventListener("click", () => saveSuivi(p.n, {statut:cur, note:$("note").value.trim(), rappel:$("rappel").value||""}));
  $("clearRappel").addEventListener("click", () => { $("rappel").value=""; saveSuivi(p.n, {statut:cur, note:$("note").value.trim(), rappel:""}); });
}

// ---------- init ----------
function boot(){
  const deps = [...new Set(P.map(p=>p.dep))].sort();
  $("fdep").innerHTML += deps.map(d=>`<option value="${d}">${d} (${P.filter(p=>p.dep===d).length})</option>`).join("");
  const pxs = [...new Set(P.map(p=>p.st))].sort();
  $("fpx").innerHTML += pxs.map(x=>`<option value="${esc(x)}">${esc(x)} (${P.filter(p=>p.st===x).length})</option>`).join("");
  const bts = [...new Set(P.map(p=>(p.bt&&p.bt.st)||"(absent de beTool)"))].sort();
  $("fbt").innerHTML += bts.map(x=>`<option value="${esc(x)}">${esc(x)} (${P.filter(p=>((p.bt&&p.bt.st)||"(absent de beTool)")===x).length})</option>`).join("");
  ["q","fdep","fst","tri","fretard","fpx","fbt"].forEach(id => $(id).addEventListener("input", render));
  try{ const t = localStorage.getItem("prospection-eq110-tri"); if(t) $("tri").value = t; }catch(e){}
  $("tri").addEventListener("change", () => { try{ localStorage.setItem("prospection-eq110-tri", $("tri").value); }catch(e){} });
  suivi = loadLocal(); render(); initDb();
}
// ---------- version hébergée : données chiffrées, code d'accès ----------
const b64 = x => Uint8Array.from(atob(x), c => c.charCodeAt(0));
async function decryptData(code){
  const enc = new TextEncoder();
  const km = await crypto.subtle.importKey("raw", enc.encode(code.trim()), "PBKDF2", false, ["deriveKey"]);
  const key = await crypto.subtle.deriveKey({name:"PBKDF2", salt:b64(ENC.salt), iterations:ENC.iter, hash:"SHA-256"}, km, {name:"AES-GCM", length:256}, false, ["decrypt"]);
  const plain = await crypto.subtle.decrypt({name:"AES-GCM", iv:b64(ENC.iv)}, key, b64(ENC.data));
  return JSON.parse(new TextDecoder().decode(plain));
}
async function unlock(code){
  try{ P = await decryptData(code); }catch(e){ return false; }
  try{ localStorage.setItem("prospection-eq110-code", code.trim()); }catch(e){}
  $("lock").hidden = true; return true;
}
if(ENC){
  $("lock").hidden = false;
  $("lockForm").addEventListener("submit", async ev => { ev.preventDefault(); const ok = await unlock($("code").value); if(!ok){ $("codeErr").textContent = "Code incorrect."; $("code").select(); } else { $("codeErr").textContent = ""; boot(); } });
  let stored = ""; try{ stored = localStorage.getItem("prospection-eq110-code") || ""; }catch(e){}
  if(stored) unlock(stored).then(ok => { if(ok) boot(); else $("code").focus(); }); else $("code").focus();
}else boot();
</script>
