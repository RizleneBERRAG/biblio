<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<link rel="manifest" href="manifest.webmanifest"><meta name="theme-color" content="#1f5f4a"><link rel="apple-touch-icon" href="icon-192.png"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-title" content="EQ110">
<title>Bibliothèque EQ110</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700&family=Manrope:wght@400;500;600;700&display=swap">
<style>
:root{
  --bg:#f1f3f1; --surface:#ffffff; --surface-2:#e8ece9; --line:#d6dcd8; --ink:#17221d; --ink-2:#4d5b54; --ink-3:#7d8a83;
  --accent:#1f5f4a; --accent-ink:#ffffff; --accent-soft:#dcebe3; --accent-soft-ink:#16493a;
  --danger:#b8322e; --danger-soft:#f7e1df; --warn:#b26a00; --warn-soft:#fbeccf; --ok:#2b7a4b; --ok-soft:#dff0e4;
  --shadow:0 1px 2px rgba(23,34,29,.06),0 6px 20px rgba(23,34,29,.08);
  --radius:14px; --font-display:"Bricolage Grotesque","Manrope",system-ui,sans-serif; --font-body:"Manrope",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  --bg:#111815; --surface:#1a2320; --surface-2:#22302a; --line:#2f3d36; --ink:#e7ece8; --ink-2:#b3bfb8; --ink-3:#7f8d86;
  --accent:#6fbf9a; --accent-ink:#0f1f19; --accent-soft:#1f3a30; --accent-soft-ink:#a9dcc4;
  --danger:#f08a85; --danger-soft:#3d2321; --warn:#e6a94a; --warn-soft:#3a2d16; --ok:#7ccb9a; --ok-soft:#1d3527;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 6px 20px rgba(0,0,0,.35);
}}
:root[data-theme="dark"]{
  --bg:#111815; --surface:#1a2320; --surface-2:#22302a; --line:#2f3d36; --ink:#e7ece8; --ink-2:#b3bfb8; --ink-3:#7f8d86;
  --accent:#6fbf9a; --accent-ink:#0f1f19; --accent-soft:#1f3a30; --accent-soft-ink:#a9dcc4;
  --danger:#f08a85; --danger-soft:#3d2321; --warn:#e6a94a; --warn-soft:#3a2d16; --ok:#7ccb9a; --ok-soft:#1d3527;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 6px 20px rgba(0,0,0,.35);
}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.5 var(--font-body);-webkit-font-smoothing:antialiased;overflow:hidden}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
a{color:var(--accent)}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.app{height:100%;display:flex;flex-direction:column}

/* ---------- top bar ---------- */
.top{flex:0 0 auto;background:var(--surface);border-bottom:1px solid var(--line);padding:10px 16px 8px;display:flex;flex-direction:column;gap:8px;padding-top:calc(10px + env(safe-area-inset-top,0px))}
.top-row{display:flex;align-items:center;gap:10px}
.brand{font:700 20px/1.1 var(--font-display);letter-spacing:-.01em;display:flex;align-items:baseline;gap:8px;min-width:0}
.brand small{font:600 12px var(--font-body);color:var(--ink-3);letter-spacing:.04em;text-transform:uppercase}
.spacer{flex:1}
.iconbtn{border:1px solid var(--line);background:var(--surface);border-radius:10px;height:38px;padding:0 12px;display:inline-flex;align-items:center;gap:6px;font-weight:600;font-size:13px;color:var(--ink-2)}
.iconbtn .n{background:var(--accent);color:var(--accent-ink);border-radius:20px;font-size:11px;padding:1px 7px;font-weight:700}
.search{position:relative}
.search input{width:100%;height:42px;border:1px solid var(--line);border-radius:12px;background:var(--surface-2);padding:0 40px 0 40px;font-size:15px;color:var(--ink)}
.search input::placeholder{color:var(--ink-3)}
.search svg{position:absolute;left:13px;top:12px;width:18px;height:18px;fill:none;stroke:var(--ink-3);stroke-width:2;stroke-linecap:round}
.search .clear{position:absolute;right:6px;top:6px;height:30px;width:30px;border:0;background:transparent;border-radius:8px;color:var(--ink-3);font-size:18px;line-height:1}
.chips{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;padding-bottom:2px;margin:0 -16px;padding-left:16px;padding-right:16px}
.chips::-webkit-scrollbar{display:none}
.chip{flex:0 0 auto;border:1px solid var(--line);background:var(--surface);border-radius:20px;padding:5px 11px;font-size:12.5px;font-weight:600;color:var(--ink-2);white-space:nowrap}
.chip[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.chip .c{opacity:.7;font-weight:500;margin-left:3px}

/* ---------- layout ---------- */
.layout{flex:1;min-height:0;display:grid;grid-template-columns:1fr;position:relative}
.list{overflow:auto;padding:10px 16px 90px;-webkit-overflow-scrolling:touch}
.list .meta{display:flex;align-items:center;gap:10px;font-size:12.5px;color:var(--ink-3);padding:2px 2px 8px}
.list .meta select{margin-left:auto;border:0;background:transparent;color:var(--accent);font-weight:600;font-size:12.5px;padding:2px 0}
.cards{display:grid;gap:10px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:12px 14px;box-shadow:var(--shadow);cursor:pointer;display:grid;gap:6px;text-align:left;width:100%}
.card:active{transform:scale(.995)}
.card.active{border-color:var(--accent);box-shadow:0 0 0 2px var(--accent-soft),var(--shadow)}
.card .h{display:flex;align-items:baseline;gap:8px}
.card .name{font:700 16px/1.2 var(--font-display);letter-spacing:-.005em;flex:1;min-width:0;text-wrap:balance}
.card .key{font-size:11px;color:var(--ink-3);font-variant-numeric:tabular-nums;white-space:nowrap}
.card .where{font-size:13px;color:var(--ink-2)}
.card .motif{font-size:13px;color:var(--ink);display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.card .foot{display:flex;flex-wrap:wrap;gap:5px;align-items:center;margin-top:2px}
.tag{font-size:11px;font-weight:600;border-radius:20px;padding:2px 8px;background:var(--surface-2);color:var(--ink-2);white-space:nowrap}
.tag.cat{background:var(--accent-soft);color:var(--accent-soft-ink)}
.tag.ne{background:var(--danger-soft);color:var(--danger)}
.tag.warn{background:var(--warn-soft);color:var(--warn)}
.tag.ok{background:var(--ok-soft);color:var(--ok)}
.tag.date{margin-left:auto;background:transparent;color:var(--ink-3);font-weight:500;font-variant-numeric:tabular-nums}
.tag.late{background:var(--danger);color:#fff}
.tag.today{background:var(--warn);color:#fff}
.tag.soon{background:var(--warn-soft);color:var(--warn)}
.empty{padding:40px 10px;text-align:center;color:var(--ink-3)}
.card .call{flex:0 0 auto;width:34px;height:34px;border-radius:10px;border:1px solid var(--line);background:var(--accent-soft);color:var(--accent-soft-ink);display:inline-flex;align-items:center;justify-content:center;text-decoration:none;margin-left:4px}
.card .call svg{width:16px;height:16px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.group-h{position:sticky;top:0;z-index:1;background:var(--bg);font:700 12px var(--font-body);text-transform:uppercase;letter-spacing:.08em;color:var(--ink-3);padding:10px 4px 6px;display:flex;justify-content:space-between}
.sheet{position:fixed;inset:0;background:rgba(17,24,21,.45);z-index:30;display:none}
.sheet.open{display:block}
.sheet .panel{position:absolute;left:0;right:0;bottom:0;max-height:90%;overflow:auto;background:var(--surface);border-radius:18px 18px 0 0;padding:14px 16px calc(20px + env(safe-area-inset-bottom,0px));box-shadow:var(--shadow)}
@media (min-width:900px){.sheet .panel{left:50%;right:auto;top:50%;bottom:auto;transform:translate(-50%,-50%);width:min(720px,92vw);max-height:86vh;border-radius:18px}}
.bars{display:grid;gap:6px;margin:4px 0 6px}
.bar{display:grid;grid-template-columns:minmax(120px,38%) 1fr 34px;align-items:center;gap:8px;font-size:13px}
.bar .lbl{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:var(--ink-2)}
.bar .trk{height:10px;background:var(--surface-2);border-radius:6px;overflow:hidden}
.bar .fill{height:100%;background:var(--accent);border-radius:6px}
.bar .n{text-align:right;font-variant-numeric:tabular-nums;font-weight:700}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:8px;margin-bottom:6px}
.kpi{background:var(--surface-2);border-radius:12px;padding:10px 12px}
.kpi b{display:block;font:700 22px/1.1 var(--font-display)}
.kpi span{font-size:12px;color:var(--ink-2)}
.copyrow{display:flex;gap:8px;flex-wrap:wrap;margin-top:6px}
.suivi input[type=date]{height:38px;border:1px solid var(--line);border-radius:10px;background:var(--surface-2);padding:0 10px;color:var(--ink)}
.suivi .row2{display:flex;align-items:center;gap:8px;flex-wrap:wrap;font-size:13px;color:var(--ink-2)}

/* ---------- filters panel ---------- */
.filters{position:absolute;inset:0;background:rgba(17,24,21,.45);z-index:20;display:none}
.filters.open{display:block}
.filters .panel{position:absolute;left:0;right:0;bottom:0;max-height:88%;overflow:auto;background:var(--surface);border-radius:18px 18px 0 0;padding:14px 16px calc(20px + env(safe-area-inset-bottom,0px));box-shadow:var(--shadow)}
.panel h2{font:700 18px var(--font-display);margin:0 0 6px;display:flex;align-items:center}
.panel h2 button{margin-left:auto}
.fgroup{padding:10px 0;border-top:1px solid var(--line)}
.fgroup h3{margin:0 0 8px;font-size:11.5px;text-transform:uppercase;letter-spacing:.08em;color:var(--ink-3);font-weight:700}
.opts{display:flex;flex-wrap:wrap;gap:6px}
.opt{border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:6px 10px;font-size:13px;font-weight:600;color:var(--ink-2)}
.opt[aria-pressed="true"]{background:var(--accent-soft);border-color:var(--accent);color:var(--accent-soft-ink)}
.link{border:0;background:transparent;color:var(--accent);font-weight:600;font-size:13px;padding:6px 0}
.btn{border:0;background:var(--accent);color:var(--accent-ink);border-radius:12px;padding:11px 16px;font-weight:700;width:100%;margin-top:8px}

/* ---------- detail ---------- */
.detail{position:absolute;inset:0;background:var(--bg);z-index:15;overflow:auto;transform:translateX(100%);transition:transform .22s ease;-webkit-overflow-scrolling:touch}
.detail.open{transform:none}
@media (prefers-reduced-motion: reduce){.detail{transition:none}}
.dhead{position:sticky;top:0;z-index:2;background:var(--surface);border-bottom:1px solid var(--line);padding:8px 12px 10px;padding-top:calc(8px + env(safe-area-inset-top,0px))}
.dhead .row{display:flex;align-items:center;gap:8px}
.back{border:0;background:transparent;color:var(--accent);font-weight:700;padding:6px 4px;display:inline-flex;align-items:center;gap:4px}
.dhead h1{font:700 22px/1.15 var(--font-display);letter-spacing:-.01em;margin:6px 0 2px;text-wrap:balance}
.dhead .sub{font-size:13px;color:var(--ink-2)}
.actions{display:flex;gap:8px;margin-top:10px;overflow-x:auto;scrollbar-width:none}
.actions::-webkit-scrollbar{display:none}
.act{flex:0 0 auto;display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);border-radius:10px;padding:7px 11px;font-size:13px;font-weight:700;color:var(--accent);background:var(--surface);text-decoration:none}
.act.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.act svg{width:16px;height:16px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.dbody{padding:12px 16px 60px;display:grid;gap:12px;max-width:1100px}
.motifbox{background:var(--danger-soft);border-radius:var(--radius);padding:12px 14px;display:grid;gap:4px}
.motifbox .lbl{font-size:11px;text-transform:uppercase;letter-spacing:.08em;font-weight:700;color:var(--danger)}
.motifbox p{margin:0;font-size:15px;line-height:1.45}
.motifbox .by{font-size:12px;color:var(--ink-2)}
details.sec{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow);overflow:hidden}
details.sec summary{list-style:none;cursor:pointer;padding:12px 14px;font:700 15px var(--font-display);display:flex;align-items:center;gap:8px}
details.sec summary::-webkit-details-marker{display:none}
details.sec summary .cnt{font:600 12px var(--font-body);color:var(--ink-3)}
details.sec summary::after{content:"";margin-left:auto;width:8px;height:8px;border-right:2px solid var(--ink-3);border-bottom:2px solid var(--ink-3);transform:rotate(45deg);transition:transform .15s}
details.sec[open] summary::after{transform:rotate(-135deg)}
details.sec .in{padding:0 14px 14px}
.kv{display:grid;grid-template-columns:minmax(110px,32%) 1fr;gap:6px 12px;font-size:14px;margin:0}
.kv dt{color:var(--ink-3)}
.kv dd{margin:0;word-break:break-word}
.kv dd a{font-weight:600;text-decoration:none}
.tl{list-style:none;margin:0;padding:0;display:grid;gap:10px}
.tl li{display:grid;gap:2px;padding-left:14px;border-left:2px solid var(--accent-soft)}
.tl .w{font-size:12px;color:var(--ink-3);font-variant-numeric:tabular-nums}
.tl .w b{color:var(--ink-2);font-weight:600}
.tl .t{white-space:pre-wrap;font-size:14px}
.tl .st{display:inline-block;font-size:12px;font-weight:700;border-radius:20px;padding:2px 9px;background:var(--surface-2);color:var(--ink-2);width:max-content}
.tl .st.ne{background:var(--danger-soft);color:var(--danger)}
.gal{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:8px}
.gal figure{margin:0;border:1px solid var(--line);border-radius:10px;overflow:hidden;background:var(--surface-2);cursor:zoom-in}
.gal img{display:block;width:100%;aspect-ratio:4/3;object-fit:cover;object-position:top}
.gal figcaption{font-size:11.5px;padding:6px 8px;color:var(--ink-2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.gal .big{grid-column:1/-1}
.gal .big img{aspect-ratio:auto;max-height:260px;object-fit:cover}
.suivi{display:grid;gap:10px}
.suivi .stat{display:flex;flex-wrap:wrap;gap:6px}
.suivi textarea{width:100%;min-height:96px;border:1px solid var(--line);border-radius:10px;background:var(--surface-2);padding:10px;resize:vertical}
.suivi .note-info{font-size:12px;color:var(--ink-3);display:flex;gap:8px;align-items:center}
.saved{color:var(--ok);font-weight:600}

/* ---------- lightbox ---------- */
.lb{position:fixed;inset:0;background:rgba(8,12,10,.96);z-index:50;display:none;flex-direction:column;padding-top:env(safe-area-inset-top,0px)}
.lb.open{display:flex}
.lb .bar{display:flex;align-items:center;gap:8px;padding:8px 12px;color:#e7ece8;font-size:13px}
.lb .bar .cap{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.lb .bar button{border:1px solid rgba(255,255,255,.25);background:rgba(255,255,255,.08);color:#fff;border-radius:8px;height:34px;min-width:34px;padding:0 10px;font-weight:700}
.lb .stage{flex:1;overflow:auto;touch-action:pan-x pan-y pinch-zoom;display:flex;align-items:flex-start;justify-content:center}
.lb .stage img{max-width:100%;height:auto;display:block;margin:0 auto}
.lb .stage img.zoom{max-width:none;width:1500px}

/* ---------- desktop ---------- */
@media (min-width: 900px){
  .layout{grid-template-columns:270px 400px 1fr}
  .filters{position:static;display:block;background:transparent;overflow:auto;border-right:1px solid var(--line)}
  .filters .panel{position:static;max-height:none;border-radius:0;box-shadow:none;background:transparent;padding:14px 16px 30px}
  .panel h2 button{display:none}
  .btn{display:none}
  .list{border-right:1px solid var(--line);padding-bottom:30px}
  .detail{position:static;transform:none;z-index:auto}
  .detail:not(.open) .dhead,.detail:not(.open) .dbody{display:none}
  .detail .placeholder{display:flex}
  .detail.open .placeholder{display:none}
  .back{display:none}
  .dbody{padding:16px 24px 60px}
  .dgrid{display:grid;grid-template-columns:1fr 1fr;gap:12px;align-items:start}
  .dgrid .span{grid-column:1/-1}
  .filtersbtn{display:none}
}
.lock{position:fixed;inset:0;background:var(--bg);z-index:100;display:none;align-items:center;justify-content:center;padding:24px}
.lock.open{display:flex}
.lock form{width:100%;max-width:360px;background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:22px 20px;box-shadow:var(--shadow);display:grid;gap:12px}
.lock h1{font:700 22px/1.15 var(--font-display);margin:0}
.lock p{margin:0;color:var(--ink-2);font-size:14px}
.lock input{height:46px;border:1px solid var(--line);border-radius:12px;background:var(--surface-2);padding:0 14px;font-size:18px;letter-spacing:.08em;text-align:center}
.lock .err{color:var(--danger);font-size:13px;min-height:18px}
.lock .btn{display:block}
.placeholder{display:none;height:100%;align-items:center;justify-content:center;color:var(--ink-3);text-align:center;padding:40px;flex-direction:column;gap:8px}
.placeholder b{font:700 22px var(--font-display);color:var(--ink-2)}
.kbd{font-size:12px;color:var(--ink-3)}
.kbd kbd{border:1px solid var(--line);border-radius:5px;padding:0 5px;font:600 11px var(--font-body);background:var(--surface)}
</style>

<div class="app">
  <header class="top">
    <div class="top-row">
      <div class="brand">Bibliothèque EQ110 <small id="count"></small></div>
      <span class="spacer"></span>
      <button class="iconbtn" id="btnStats" type="button" title="Vue d'ensemble">Synthèse</button>
      <button class="iconbtn" id="btnTheme" type="button" aria-label="Changer de thème" title="Clair / sombre">◐</button>
      <button class="iconbtn filtersbtn" id="btnFilters" type="button">Filtres <span class="n" id="nFilters" hidden>0</span></button>
    </div>
    <div class="search">
      <svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
      <input id="q" type="search" placeholder="Nom, ville, SIRET, téléphone, note…" autocomplete="off" enterkeyhint="search">
      <button class="clear" id="qClear" type="button" aria-label="Effacer" hidden>×</button>
    </div>
    <div class="chips" id="chips"></div>
  </header>

  <div class="layout">
    <aside class="filters" id="filters">
      <div class="panel">
        <h2>Filtres <button class="link" id="closeFilters" type="button">Fermer</button></h2>
        <div class="fgroup"><h3>Motif de non-éligibilité</h3><div class="opts" id="fCat"></div></div>
        <div class="fgroup"><h3>Département</h3><div class="opts" id="fDep"></div></div>
        <div class="fgroup"><h3>Unité d'affaire</h3><div class="opts" id="fUnit"></div></div>
        <div class="fgroup"><h3>Mon suivi</h3><div class="opts" id="fSuivi"></div></div>
        <div class="fgroup"><h3>Rappels planifiés</h3><div class="opts" id="fRappel"></div></div>
        <div class="fgroup"><h3>Pièces jointes</h3><div class="opts" id="fDocs"></div></div>
        <div class="fgroup"><button class="link" id="resetFilters" type="button">Réinitialiser les filtres</button> <button class="link" id="lockBtn" type="button" hidden>Verrouiller (oublier le code)</button></div>
        <button class="btn" id="applyFilters" type="button">Voir les résultats</button>
      </div>
    </aside>

    <section class="list" id="list">
      <div class="meta"><span id="shown"></span><select id="sort" aria-label="Tri"><option value="date">Plus récents</option><option value="rappel">Prochain rappel</option><option value="name">Nom A → Z</option><option value="dep">Département</option><option value="cat">Motif</option></select></div>
      <div class="cards" id="cards"></div>
    </section>

    <section class="detail" id="detail">
      <div class="placeholder"><b>Choisis un dossier</b><span>La fiche complète s'affiche ici.</span><span class="kbd"><kbd>↑</kbd> <kbd>↓</kbd> pour naviguer · <kbd>Échap</kbd> pour fermer</span></div>
      <div class="dhead" id="dhead"></div>
      <div class="dbody" id="dbody"></div>
    </section>
  </div>
</div>

<div class="sheet" id="stats"><div class="panel"><h2>Synthèse <button class="link" id="closeStats" type="button">Fermer</button></h2><div id="statsBody"></div></div></div>
<div class="lock" id="lock"><form id="lockForm"><h1>Bibliothèque EQ110</h1><p>Entre le code d'accès pour ouvrir les dossiers.</p><input id="code" type="password" autocomplete="current-password" placeholder="Code d'accès" aria-label="Code d'accès"><div class="err" id="codeErr"></div><button class="btn" type="submit">Ouvrir</button></form></div>
<div class="lb" id="lb" role="dialog" aria-label="Image">
  <div class="bar"><button type="button" id="lbPrev" aria-label="Précédente">‹</button><span class="cap" id="lbCap"></span><button type="button" id="lbNext" aria-label="Suivante">›</button><button type="button" id="lbZoom">1:1</button><button type="button" id="lbClose" aria-label="Fermer">×</button></div>
  <div class="stage" id="lbStage"><img id="lbImg" alt=""></div>

/* ---------- rappels & dates relatives ---------- */
const todayISO = () => { const d = new Date(); return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0'); };
function dueState(r) { if (!r) return ''; const t = todayISO(); if (r < t) return 'late'; if (r === t) return 'today'; const in7 = new Date(Date.now() + 7 * 864e5); const s7 = in7.getFullYear() + '-' + String(in7.getMonth() + 1).padStart(2, '0') + '-' + String(in7.getDate()).padStart(2, '0'); return r <= s7 ? 'soon' : 'planned'; }
const DUE_LABEL = { late: 'En retard', today: "Aujourd'hui", soon: 'Cette semaine', planned: 'Planifié' };
function fmtDay(iso) { if (!iso) return ''; const [y, m, d] = iso.split('-'); return `${d}/${m}/${y}`; }
function relTime(iso) { const t = new Date(iso).getTime(); if (isNaN(t)) return ''; const m = Math.round((Date.now() - t) / 60000); if (m < 1) return "à l'instant"; if (m < 60) return `il y a ${m} min`; const h = Math.round(m / 60); if (h < 24) return `il y a ${h} h`; const d = Math.round(h / 24); if (d < 30) return `il y a ${d} j`; return `il y a ${Math.round(d / 30)} mois`; }
function rappelTag(key) { const r = sv(key).rappel; const st = dueState(r); if (!st) return ''; return `<span class="tag ${st}">Rappel ${esc(fmtDay(r))}</span>`; }

/* ---------- thème clair / sombre ---------- */

/* ---------- indexes (filled once DATA is available) ---------- */
let cats = [], deps = [], units = [];
function indexData() {
  DATA.forEach(f => { f._hay = fold([f.key, f.nom, f.siret, f.ville, f.cp, f.tel, f.email, f.unite, f.sig.nom, f.sig.tel, f.sig.email, f.chantier.ville, f.chantier.parcelle, f.cat, ...f.notes.map(n => n.t)].join(' ')); });
  cats = CAT_ORDER.filter(c => DATA.some(f => f.cat === c));
  deps = uniq(DATA.map(f => f.dep)).sort();
  units = uniq(DATA.map(f => f.unite)).sort();
}

/* ---------- code d'accès (version hébergée : données chiffrées côté client) ---------- */
const b64 = s => Uint8Array.from(atob(s), c => c.charCodeAt(0));
async function decryptData(code) {
  const enc = new TextEncoder();
  const km = await crypto.subtle.importKey('raw', enc.encode(code.trim()), 'PBKDF2', false, ['deriveKey']);
  const key = await crypto.subtle.deriveKey({ name: 'PBKDF2', salt: b64(ENC.salt), iterations: ENC.iter, hash: 'SHA-256' }, km, { name: 'AES-GCM', length: 256 }, false, ['decrypt']);
  const plain = await crypto.subtle.decrypt({ name: 'AES-GCM', iv: b64(ENC.iv) }, key, b64(ENC.data));
  return JSON.parse(new TextDecoder().decode(plain));
}
async function unlock(code) {
  try { DATA = await decryptData(code); } catch (e) { return false; }
  try { localStorage.setItem('eq110-code', code.trim()); } catch (e) {}
  $('#lock').classList.remove('open'); $('#lockBtn').hidden = false;
  return true;
}
$('#lockForm').addEventListener('submit', async ev => { ev.preventDefault(); const ok = await unlock($('#code').value); if (!ok) { $('#codeErr').textContent = 'Code incorrect.'; $('#code').select(); } else { $('#codeErr').textContent = ''; boot(); } });
$('#lockBtn').addEventListener('click', () => { try { localStorage.removeItem('eq110-code'); } catch (e) {} location.reload(); });

/* ---------- filtering ---------- */
function sv(key) { return suivi[key] || {}; }
function filtered() {
  const q = fold(state.q.trim());
  let list = DATA.filter(f => (!q || f._hay.includes(q) || fold(sv(f.key).note || '').includes(q))
    && (!state.cat.size || state.cat.has(f.cat)) && (!state.dep.size || state.dep.has(f.dep)) && (!state.unit.size || state.unit.has(f.unite))
    && (!state.suivi.size || state.suivi.has(sv(f.key).statut || '—'))
    && (!state.rappel || (state.rappel === 'any' ? !!sv(f.key).rappel : dueState(sv(f.key).rappel) === state.rappel))
    && (state.docs === '' || (state.docs === '1') === (f.docs.length > 0)));
  const byName = (a, b) => a.nom.localeCompare(b.nom, 'fr');
  if (state.sort === 'name') list.sort(byName);
  else if (state.sort === 'dep') list.sort((a, b) => (a.dep || '99').localeCompare(b.dep || '99') || byName(a, b));
  else if (state.sort === 'cat') list.sort((a, b) => CAT_ORDER.indexOf(a.cat) - CAT_ORDER.indexOf(b.cat) || byName(a, b));
  else if (state.sort === 'rappel') list.sort((a, b) => (sv(a.key).rappel || '9999').localeCompare(sv(b.key).rappel || '9999') || byName(a, b));
  else list.sort((a, b) => (b.dateNE || b.creation).localeCompare(a.dateNE || a.creation));
  return list;
}
function activeFilterCount() { return state.cat.size + state.dep.size + state.unit.size + state.suivi.size + (state.docs ? 1 : 0) + (state.rappel ? 1 : 0); }

/* ---------- synthèse ---------- */
function bars(counts, total, order) {
  const keys = order ? order.filter(k => counts[k]) : Object.keys(counts).sort((a, b) => counts[b] - counts[a]);
  const max = Math.max(1, ...keys.map(k => counts[k]));
  return '<div class="bars">' + keys.map(k => `<div class="bar"><span class="lbl" title="${esc(k)}">${esc(k)}</span><span class="trk"><span class="fill" style="width:${Math.round(counts[k] / max * 100)}%"></span></span><span class="n">${counts[k]}</span></div>`).join('') + '</div>';
}
function renderStats() {
  const list = filtered(); const n = list.length || 1;

  const byCat = count(f => f.cat), byDep = count(f => f.dep ? f.dep : 'Sans dép.'), byUnit = count(f => f.unite || '—');
  const byDay = count(f => fmtD(f.dateNE || f.creation)); const days = Object.keys(byDay).sort((a, b) => a.split('/').reverse().join('').localeCompare(b.split('/').reverse().join(''))).slice(-14);
  const dayCounts = {}; days.forEach(d => dayCounts[d] = byDay[d]);

  const byWho = count(f => f.parNE || '');
  $('#statsBody').innerHTML = `<p class="kbd" style="margin:0 0 10px">Sur les ${list.length} dossier${list.length > 1 ? 's' : ''} affichés${activeFilterCount() || state.q ? ' (filtres actifs)' : ''}.</p>

    <div class="fgroup"><h3>Par motif</h3>${bars(byCat, n, CAT_ORDER)}</div>
    <div class="fgroup"><h3>Par département</h3>${bars(byDep, n)}</div>

    <details class="sec span"><summary>Pièces jointes <span class="cnt">${f.docs.length}</span></summary><div class="in">${galPJ}</div></details>
    <details class="sec span"><summary>Captures de la fiche beTool <span class="cnt">${caps.length}</span></summary><div class="in">${caps.length ? '<div class="gal">' + caps.join('') + '</div>' : '<span class="kbd">Pas de capture.</span>'}</div></details>
    <details class="sec span"><summary>Historique des statuts <span class="cnt">${f.hist.length}</span></summary><div class="in"><ul class="tl">${f.hist.map(h => `<li><span class="st ${/ligible/.test(h.s) ? 'ne' : ''}">${esc(h.s)}</span><span class="w">${esc(fmtDT(h.d))} · ${esc(h.u)}</span></li>`).join('')}</ul></div></details>
    </div>`;
  $('#suiviMode').textContent = lsOnly ? '· sur cet appareil' : (dbWritable ? '· partagé' : '· lecture seule');
  $('#detail').classList.add('open'); $('#detail').scrollTop = 0;
  if (push !== false) { try { history.pushState({ key }, '', '#' + encodeURIComponent(key)); } catch (e) {} }
  const refreshHead = () => { $('#dhead').querySelector('.row').innerHTML = headRow(); $('#back').addEventListener('click', closeDetail); };
  $('#back').addEventListener('click', closeDetail);
  $('#stat').addEventListener('click', ev => { const b = ev.target.closest('.opt'); if (!b) return; const cur = sv(key).statut; saveSuivi(key, { statut: cur === b.dataset.s ? '' : b.dataset.s }); $('#stat').querySelectorAll('.opt').forEach(o => o.setAttribute('aria-pressed', o.dataset.s === sv(key).statut)); refreshHead(); renderList(); });
  const setRappel = v => { saveSuivi(key, { rappel: v }); $('#rappel').value = v; $('#rappelClear').hidden = !v; const st = dueState(v); $('#rappelState').innerHTML = st ? `<span class="tag ${st}">${DUE_LABEL[st]}</span>` : ''; refreshHead(); renderList(); renderFilters(); };
  $('#rappel').addEventListener('change', ev => setRappel(ev.target.value));
  $('#rappelClear').addEventListener('click', () => setRappel(''));
  $('#copyFiche').addEventListener('click', ev => copyText(ficheTexte(f), ev.currentTarget));
  $('#copyLink').addEventListener('click', ev => copyText(location.origin + location.pathname + '#' + encodeURIComponent(key), ev.currentTarget));
  let t; $('#note').addEventListener('input', ev => { clearTimeout(t); t = setTimeout(() => saveSuivi(key, { note: ev.target.value }), 600); });
  document.querySelectorAll('#dbody .gal figure[data-i]').forEach(fig => fig.addEventListener('click', () => openLb(+fig.dataset.i)));
  renderList();
  const card = document.querySelector(`.card[data-key="${CSS.escape(key)}"]`); if (card && window.innerWidth >= 900) card.scrollIntoView({ block: 'nearest' });
}
function closeDetail() { $('#detail').classList.remove('open'); state.current = null; renderList(); try { history.replaceState(null, '', location.pathname); } catch (e) {} }

/* ---------- suivi persistence (db shared, fallback local) ---------- */
async function saveSuivi(key, patch) {
  const next = Object.assign({}, suivi[key], patch, { updatedAt: new Date().toISOString() });
  suivi[key] = next; persistSuiviLocal();
  const el = $('#noteSaved'); if (el) { el.textContent = 'enregistré'; el.className = 'saved'; setTimeout(() => { if (el.textContent === 'enregistré') el.textContent = ''; }, 1500); }
  if (dbRef && dbWritable) { try { await dbRef.doc('suivi/' + key).set(next); } catch (e) { if (e && e.code === 'invalid_argument') { dbWritable = false; const m = $('#suiviMode'); if (m) m.textContent = '· lecture seule'; } } }
}
(async () => {
  try {
    if (!window.claude || !window.claude.use) return;
    const db = await window.claude.use('db'); if (!db) return;
    dbRef = db; lsOnly = false;
    db.collection('suivi').onSnapshot(snap => {
      snap.docs.forEach(d => { const v = d.data(); if (v) suivi[d.id] = v; });
      snap.docChanges().forEach(c => { if (c.type === 'removed') delete suivi[c.doc.id]; });
      persistSuiviLocal(); renderList();
      if (state.current && document.activeElement !== $('#note')) { const s = sv(state.current); const n = $('#note'); if (n && n.value !== (s.note || '')) n.value = s.note || ''; document.querySelectorAll('#stat .opt').forEach(o => o.setAttribute('aria-pressed', o.dataset.s === s.statut)); const r = $('#rappel'); if (r && r.value !== (s.rappel || '')) { r.value = s.rappel || ''; $('#rappelClear').hidden = !s.rappel; } }
      renderFilters();
      const m = $('#suiviMode'); if (m) m.textContent = dbWritable ? '· partagé' : '· lecture seule';
    }, err => { lsOnly = true; const m = $('#suiviMode'); if (m) m.textContent = '· sur cet appareil'; });
    try { const u = await window.claude.use('user'); if (u && typeof u.can === 'function') { const w = await u.can('data.write'); if (w === false) dbWritable = false; } } catch (e) {}
  } catch (e) {}
})();

/* ---------- lightbox ---------- */
let lbI = 0;
function openLb(i) { if (!galleryItems[i]) return; lbI = i; const it = galleryItems[i]; $('#lbImg').src = it.src; $('#lbImg').className = ''; $('#lbZoom').textContent = '1:1'; $('#lbCap').textContent = `${it.cap} · ${i + 1}/${galleryItems.length}`; $('#lb').classList.add('open'); $('#lbStage').scrollTop = 0; }
function closeLb() { $('#lb').classList.remove('open'); $('#lbImg').src = ''; }
$('#lbClose').addEventListener('click', closeLb); $('#lbPrev').addEventListener('click', () => openLb((lbI - 1 + galleryItems.length) % galleryItems.length)); $('#lbNext').addEventListener('click', () => openLb((lbI + 1) % galleryItems.length));
$('#lbZoom').addEventListener('click', () => { const im = $('#lbImg'); im.classList.toggle('zoom'); $('#lbZoom').textContent = im.classList.contains('zoom') ? 'Ajuster' : '1:1'; });
$('#lbImg').addEventListener('dblclick', () => $('#lbZoom').click());
let tx = null; $('#lbStage').addEventListener('touchstart', e => { tx = e.touches[0].clientX; }, { passive: true }); $('#lbStage').addEventListener('touchend', e => { if (tx === null || $('#lbImg').classList.contains('zoom')) return; const dx = e.changedTouches[0].clientX - tx; if (Math.abs(dx) > 60) (dx < 0 ? $('#lbNext') : $('#lbPrev')).click(); tx = null; }, { passive: true });

/* ---------- events ---------- */
$('#cards').addEventListener('click', ev => { if (ev.target.closest('.call')) return; const c = ev.target.closest('.card'); if (c) renderDetail(c.dataset.key); });
$('#cards').addEventListener('keydown', ev => { if (ev.key === 'Enter' || ev.key === ' ') { const c = ev.target.closest('.card'); if (c) { ev.preventDefault(); renderDetail(c.dataset.key); } } });
$('#fRappel').addEventListener('click', ev => { const b = ev.target.closest('.opt'); if (!b) return; state.rappel = b.dataset.v; afterFilter(); });
$('#q').addEventListener('input', ev => { state.q = ev.target.value; $('#qClear').hidden = !state.q; renderList(); });
$('#qClear').addEventListener('click', () => { $('#q').value = ''; state.q = ''; $('#qClear').hidden = true; renderList(); $('#q').focus(); });
$('#sort').value = state.sort; $('#sort').addEventListener('change', ev => { state.sort = ev.target.value; persistState(); renderList(); });
$('#chips').addEventListener('click', ev => { const b = ev.target.closest('.chip'); if (!b) return; const c = b.dataset.cat; if (!c) state.cat.clear(); else if (state.cat.has(c)) state.cat.delete(c); else { state.cat.clear(); state.cat.add(c); } persistState(); renderChips(); renderFilters(); renderList(); });
function toggleIn(set, v) { set.has(v) ? set.delete(v) : set.add(v); }
$('#fCat').addEventListener('click', ev => { const b = ev.target.closest('.opt'); if (!b) return; toggleIn(state.cat, b.dataset.v); afterFilter(); });
$('#fDep').addEventListener('click', ev => { const b = ev.target.closest('.opt'); if (!b) return; toggleIn(state.dep, b.dataset.v); afterFilter(); });
$('#fUnit').addEventListener('click', ev => { const b = ev.target.closest('.opt'); if (!b) return; toggleIn(state.unit, b.dataset.v); afterFilter(); });
$('#fSuivi').addEventListener('click', ev => { const b = ev.target.closest('.opt'); if (!b) return; toggleIn(state.suivi, b.dataset.v); afterFilter(); });
$('#fDocs').addEventListener('click', ev => { const b = ev.target.closest('.opt'); if (!b) return; state.docs = b.dataset.v; afterFilter(); });
function afterFilter() { persistState(); renderChips(); renderFilters(); renderList(); }
$('#resetFilters').addEventListener('click', () => { state.cat.clear(); state.dep.clear(); state.unit.clear(); state.suivi.clear(); state.docs = ''; state.rappel = ''; afterFilter(); });
$('#btnFilters').addEventListener('click', () => $('#filters').classList.add('open'));
$('#closeFilters').addEventListener('click', () => $('#filters').classList.remove('open'));
$('#applyFilters').addEventListener('click', () => $('#filters').classList.remove('open'));
$('#filters').addEventListener('click', ev => { if (ev.target === $('#filters')) $('#filters').classList.remove('open'); });
document.addEventListener('keydown', ev => {
  if (ev.key === 'Escape') { if ($('#lb').classList.contains('open')) return closeLb(); if ($('#stats').classList.contains('open')) return $('#stats').classList.remove('open'); if ($('#filters').classList.contains('open')) return $('#filters').classList.remove('open'); if (state.current) return closeDetail(); }
  if ($('#lb').classList.contains('open')) { if (ev.key === 'ArrowLeft') $('#lbPrev').click(); if (ev.key === 'ArrowRight') $('#lbNext').click(); return; }
  if (ev.target.tagName === 'INPUT' || ev.target.tagName === 'TEXTAREA') return;
  if (ev.key === 'ArrowDown' || ev.key === 'ArrowUp') { const l = filtered(); if (!l.length) return; const i = l.findIndex(f => f.key === state.current); const n = l[i < 0 ? 0 : i + (ev.key === 'ArrowDown' ? 1 : -1)]; if (n) { renderDetail(n.key); ev.preventDefault(); } }
});
window.addEventListener('popstate', ev => { const k = ev.state && ev.state.key; if (k) renderDetail(k, false); else if (state.current) { $('#detail').classList.remove('open'); state.current = null; renderList(); } });

/* ---------- boot ---------- */
let hotSaved = null;
function start(saved) {
  hotSaved = saved || null;
  if (ENC && 'serviceWorker' in navigator && location.protocol === 'https:') { try { navigator.serviceWorker.register('sw.js').catch(() => {}); } catch (e) {} }
  if (ENC && !DATA) {
    let stored = ''; try { stored = localStorage.getItem('eq110-code') || ''; } catch (e) {}
    if (stored) unlock(stored).then(ok => { if (ok) boot(); else { $('#lock').classList.add('open'); $('#code').focus(); } });
    else { $('#lock').classList.add('open'); setTimeout(() => $('#code').focus(), 50); }
    return;
  }
  boot();
}
function boot() {
  const saved = hotSaved;
  indexData();
  if (saved && saved.q) { state.q = saved.q; $('#q').value = saved.q; $('#qClear').hidden = !saved.q; }
  renderChips(); renderFilters(); renderList();
  const k = (saved && saved.current) || (location.hash.length > 1 ? decodeURIComponent(location.hash.slice(1)) : null);
  if (k && DATA.some(f => f.key === k)) renderDetail(k, false);
}
try { window.claude?.hot?.snapshot?.(() => ({ q: state.q, current: state.current })); } catch (e) {}
if (window.claude?.hot?.ready) window.claude.hot.ready(start); else start(window.claude?.hot?.data ?? null);
</script>
